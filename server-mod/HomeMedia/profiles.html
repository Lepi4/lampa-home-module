<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Локальные профили Lampa</title>
<style>body{font:16px system-ui;background:#151923;color:#eee;max-width:1050px;margin:30px auto;padding:0 18px}input,select,button{font:inherit;padding:8px;margin:5px;background:#262e3c;color:#fff;border:1px solid #566;border-radius:5px}label{display:inline-block;margin:6px}section{background:#202633;padding:16px;margin:16px 0;border-radius:10px}small{display:block;color:#bdc8db}pre{white-space:pre-wrap}a{color:#9cf}</style>
<h1>Профили Lampa</h1><p>Раздельные просмотры, источники, закладки и ленты. Кинопаб хранит общий список закладок.</p><section id="login"><label>Профиль администратора <select id="admin"></select></label><label>ПИН (если задан) <input id="pin" type="password" inputmode="numeric" maxlength="8"></label><button id="enter">Войти</button></section><p id="message"></p><main id="main" hidden><button id="activate">Включить профили после импорта закладок</button><button id="add">Добавить профиль</button><a href="/home">Панель сервера</a><div id="profiles"></div><section><h2>Исключения родительского контроля</h2><select id="ruleProfile"></select><select id="ruleKind"><option value="content">Карточка (tmdb:tv:235930)</option><option value="youtube_channel">Канал YouTube (UC…)</option><option value="youtube_video">Видео YouTube</option></select><input id="subject" placeholder="Идентификатор"><select id="decision"><option value="allow">Разрешить</option><option value="deny">Запретить</option><option value="inherit">По возрастному правилу</option></select><button id="saveRule">Сохранить</button><pre id="rules"></pre></section><section><h2>Классификация мультфильмов и аниме</h2><input id="content" placeholder="tmdb:tv:235930"><select id="kind"><option value="anime_series">Аниме-сериал</option><option value="anime_movie">Аниме-фильм</option><option value="cartoon_series">Мультсериал</option><option value="cartoon_movie">Мультфильм</option><option value="series">Сериал</option><option value="movie">Фильм</option><option value="inherit">Автоматически</option></select><button id="saveKind">Сохранить</button></section><section><h2>Зеркало Кинопаба</h2><button id="mirror">Обновить статус</button><pre id="mirrorState"></pre></section></main>
<script>
(function(){'use strict';var data=null;function $(id){return document.getElementById(id)}function say(s){$('message').textContent=s}function node(t,text){var n=document.createElement(t);if(text!=null)n.textContent=text;return n}function field(label,value,type){var l=node('label',label+' '),i=node('input');i.type=type||'text';if(i.type==='checkbox')i.checked=!!value;else i.value=value==null?'':value;l.appendChild(i);return {label:l,input:i}}
async function api(path,body){var r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:body?JSON.stringify(body):undefined});var d=await r.json();if(r.status===401){$('login').hidden=false;$('main').hidden=true;}if(!r.ok||d.error)throw Error(d.error||r.status);return d}
function safeNext(){try{var v=new URLSearchParams(location.search).get('next')||'';return v.indexOf('/home/')===0&&v.indexOf('//')!==0&&v.indexOf('\\')<0?v:'';}catch(e){return '';}}
function action(f){return async function(){try{await f()}catch(e){say(e.message)}}}function button(parent,title,fn){var b=node('button',title);b.onclick=action(fn);parent.appendChild(b)}
async function refresh(){data=await api('/home/admin/profiles');try{data.youtube=await api('/yt/profiles')}catch(e){data.youtube={profiles:[]}}$('activate').hidden=data.enabled;$('profiles').textContent='';$('ruleProfile').textContent='';data.profiles.forEach(function(p){var opt=node('option',p.name);opt.value=p.id;$('ruleProfile').appendChild(opt);render(p)});$('main').hidden=false;$('login').hidden=true;await rules()}
function render(p){var box=node('section');box.appendChild(node('h2',p.name||'Новый профиль'));var name=field('Имя',p.name),child=field('Детский',p.is_child,'checkbox'),pin=field('Новый ПИН (необязательно)','', 'password'),clear=field('Удалить ПИН',false,'checkbox');[name,child,pin,clear].forEach(x=>box.appendChild(x.label));
var age=node('select');box.appendChild(node('label','Возрастной ценз '));(p.max_age===13?[6,12,13,16]:[6,12,16]).forEach(function(a){var o=node('option','Детский, до '+a+' лет');o.value=a;o.selected=p.max_age===a;age.appendChild(o)});box.appendChild(age);box.appendChild(node('small','Ценз действует, когда включён «Детский». 6 — детский, 13 — семейный, 16 — подростковый. Взрослый профиль каталог по возрасту не режет.'));var yt=node('select');[['normal','YouTube: обычный, без известных возрастных нарушений'],['channels','YouTube: выбранные каналы'],['off','YouTube: выключен']].forEach(function(a){var o=node('option',a[1]);o.value=a[0];o.selected=(p.settings||{}).youtube_mode===a[0];yt.appendChild(o)});box.appendChild(yt);var ytPack=node('select');var own=node('option','YouTube: свой набор');own.value='';own.selected=!(p.settings||{}).youtube_profile;ytPack.appendChild(own);((data.youtube&&data.youtube.profiles)||[]).forEach(function(a){if(!a.name||a.name.indexOf('usr_')===0||a.name.indexOf('pack:')===0)return;var o=node('option','YouTube: '+a.label+' ('+a.subs+')');o.value=a.name;o.selected=(p.settings||{}).youtube_profile===a.name;ytPack.appendChild(o)});box.appendChild(ytPack);
var sources=p.settings&&p.settings.sources||{};var ytOn=field('Разрешить YouTube',sources.youtube!==false&&(p.settings||{}).youtube_mode!=='off','checkbox'),vkOn=field('Разрешить VK Video (пока недоступно)',sources.vk===true,'checkbox');vkOn.input.disabled=true;vkOn.input.title='Публичные каналы и плейлисты не прошли проверку стабильности';box.appendChild(ytOn.label);box.appendChild(vkOn.label);
var auto=field('Авто-торренты',(p.settings||{}).torrent_auto,'checkbox'),max=field('Максимум высоты (720/1080/2160)',(p.settings||{}).torrent_max_height||1080,'number'),seeds=field('Минимум сидов',(p.settings||{}).torrent_min_seeds||5,'number');[auto,max,seeds].forEach(x=>box.appendChild(x.label));box.appendChild(node('small','Возраст без рейтинга: требуется исключение. Для YouTube в обычном режиме неизвестный рейтинг допускается. ПИН: 4–8 цифр; пустое поле оставляет прежний ПИН.'));
button(box,'Сохранить',async function(){var body={id:p.id,name:name.input.value,is_child:child.input.checked,max_age:+age.value,settings:Object.assign({},p.settings,{sources:Object.assign({},sources,{youtube:ytOn.input.checked,vk:vkOn.input.checked}),youtube_mode:yt.value,youtube_profile:ytPack.value,torrent_auto:auto.input.checked,torrent_max_height:+max.input.value,torrent_min_seeds:+seeds.input.value})};if(clear.input.checked||pin.input.value)body.pin=clear.input.checked?'':pin.input.value;await api('/home/admin/profiles',body);say('Сохранено');await refresh()});
if(p.id){button(box,p.id===data.default_profile?'По умолчанию ✓':'Сделать профилем холодного запуска',async function(){await api('/home/admin/default-profile',{profile_id:p.id});await refresh()});button(box,'Ленты',async function(){await editRows(box,p)});if(p.id!=='u_default')button(box,'Архивировать',async function(){await api('/home/admin/profiles/'+encodeURIComponent(p.id)+'/archive',{});await refresh()})}$('profiles').appendChild(box)}
async function editRows(box,p){var d=await api('/home/admin/profile-rows?profile_id='+encodeURIComponent(p.id));var editor=node('div'),rows=d.rows;function paint(){editor.textContent='';rows.forEach(function(r,i){var l=field(r.id,r.enabled,'checkbox');editor.appendChild(l.label);l.input.onchange=function(){r.enabled=this.checked};button(editor,'↑',function(){if(i){rows.splice(i-1,0,rows.splice(i,1)[0]);paint()}});button(editor,'↓',function(){if(i<rows.length-1){rows.splice(i+1,0,rows.splice(i,1)[0]);paint()}});editor.appendChild(node('br'))});button(editor,'Сохранить ленты',async function(){await api('/home/admin/profile-rows?profile_id='+encodeURIComponent(p.id),{rows:rows.map((r,i)=>({id:r.id,enabled:r.enabled,order:i}))});editor.remove();say('Ленты сохранены')})}paint();box.appendChild(editor)}
async function rules(){if($('ruleProfile').value)$('rules').textContent=JSON.stringify((await api('/home/admin/profile-rules?profile_id='+encodeURIComponent($('ruleProfile').value))).rules,null,2)}
$('enter').onclick=action(async function(){await api('/home/admin/login',{profile_id:$('admin').value,pin:$('pin').value});$('pin').value='';await refresh();var n=safeNext();if(n)location.replace(n)});$('activate').onclick=action(async function(){await api('/home/admin/activate-profiles',{});say('Профили включены. Перезапустите клиентские приложения.');await refresh()});$('add').onclick=function(){render({settings:{youtube_mode:'normal',torrent_auto:false},max_age:13})};$('saveRule').onclick=action(async function(){await api('/home/admin/profile-rules?profile_id='+encodeURIComponent($('ruleProfile').value),{kind:$('ruleKind').value,subject:$('subject').value.trim(),decision:$('decision').value});await rules()});$('ruleProfile').onchange=action(rules);$('saveKind').onclick=action(async function(){await api('/home/admin/content-kind',{content_id:$('content').value.trim(),kind:$('kind').value});say('Классификация сохранена')});$('mirror').onclick=action(async function(){$('mirrorState').textContent=JSON.stringify(await api('/home/admin/mirror'),null,2)});api('/home/profiles').then(d=>d.profiles.filter(p=>!p.is_child).forEach(function(p){var o=node('option',p.name);o.value=p.id;$('admin').appendChild(o)})).catch(e=>say(e.message));refresh().catch(function(){});
})();</script></html>
